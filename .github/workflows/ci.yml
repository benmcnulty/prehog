name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: ESLint (browser globals, no config file needed)
        run: npx --yes eslint@8 --no-eslintrc --env browser,es2021 --parser-options=ecmaVersion:2022 --rule '{"no-undef":"error","no-unused-vars":["error",{"argsIgnorePattern":"^_"}]}' "*.js"
      - name: Stylelint
        run: npx --yes -p stylelint@16 -p stylelint-config-recommended@14 stylelint --config '{"extends":"stylelint-config-recommended","rules":{"no-descending-specificity":null,"no-duplicate-selectors":null}}' "*.css"
      - name: Secret scan (tracked files)
        run: |
          if git grep -nE 'sk-or-v1-|sk-ant-|AIza[0-9A-Za-z_-]{30,}|ghp_[0-9A-Za-z]{30,}' -- . ':!.github/workflows/ci.yml'; then
            echo "Possible credential committed"; exit 1; fi
